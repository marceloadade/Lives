# Ansible settings. Ansible reads this automatically when you run a command
# from this folder, so you never have to pass these as flags.
[defaults]
inventory = inventory.yml

# Show task results as readable YAML instead of one long JSON line.
result_format = yaml

# Don't ask "are you sure?" about host keys in a throwaway lab.
host_key_checking = False

# How many servers to work on at the same time. 10 is plenty for a demo.
forks = 10
